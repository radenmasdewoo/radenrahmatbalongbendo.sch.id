        { name: "SMP R RAHMAT", level: "SMP (Setara MTs)", wa: "6285706673560", logo: "https://radenrahmatbalongbendo.sch.id/logo-smp.webp", principal: "Abdul Amin, S.Pd." },

      ],
      address: "Jl. Mayjen Bambang Yuwono No.110, Balongbendo, Sidoarjo",
      phone: "(031) 8970323"
    };

    const SYSTEM_PROMPT = `Sebagai Asisten Virtual (AI) cerdas BP3NU RADEN RAHMAT BALONGBENDO, awali setiap percakapan dengan salam (Assalamu'alaikum). Gunakan bahasa yang sangat sopan (bahasa Indonesia formal namun ramah), Islami, profesional, dan solutif.

   - Mengelola unit: MI RADEN RAHMAT, SMP R RAHMAT, dan SMA R RAHMAT (SMARTBA).
   - Legalitas: NIB 1910240004751, SK Menkumham AHU-0001097.AH.01.08.TAHUN 2024.
   - Lokasi: Jl. Mayjen Bambang Yuwono No. 110, Balongbendo, Sidoarjo.
   - Pimpinan BP3NU: Drs. H. Moh. Zuhdi.

2. MI RADEN RAHMAT (Unit Dasar):
   - Berdiri: 1949 (SRINU). Akreditasi A.
   - Fokus: Aswaja An-Nahdliyah, Tahfidz Juz 30, Kitab Alala.
   - Kepala Madrasah: Titik Rohma Hidayati, S.Ag.

3. SMP R RAHMAT (Unit Menengah):
   - Berdiri: 5 Januari 1969. Akreditasi A.
   - Slogan: "Unggul Dalam Prestasi, Mulia Dalam Budi Pekerti".
   - Fasilitas: Lab IPA, Komputer modern, Musholla, Perpustakaan.
   - Kepala Sekolah: Abdul Amin, S.Pd.

   - Berdiri: 2002. Fokus: PTN & Vokasi.
   - Kepala Sekolah: Mohammad Sony Bahrudin.

INFORMASI PPDB (Pendaftaran 2026):
- Arahkan user ke WhatsApp unit terkait menggunakan [SHOW_PPDB_CARD].
- Kantor pendaftaran buka jam 07.45 - 13.00 WIB.

    let chatHistory = [];
    let isOpen = false;
    let isBusy = false;

    function escHtml(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function rrToggleChat() {
      isOpen = !isOpen;
      const win = document.getElementById('rr-chat-window');
      const fab = document.getElementById('rr-chat-fab');
      const badge = document.getElementById('rr-chat-badge');
      win.classList.toggle('visible', isOpen);
      fab.classList.toggle('open', isOpen);
      if (isOpen) {
        badge.style.display = 'none';
        if (chatHistory.length === 0) rrShowGreeting();
        setTimeout(() => document.getElementById('rr-input').focus(), 300);
      }
    }
    window.rrToggleChat = rrToggleChat;

    function rrShowGreeting() {
      addBotMsg(`Assalamu'alaikum! 👋 Selamat datang di **BP3NU RADEN RAHMAT**. Ada yang bisa saya bantu terkait MI, SMP, atau SMA kami?`, [
        "📋 Info Pendaftaran (PPDB)",
        "🏫 Profil Sejarah Madrasah",
        "📍 Lokasi & Kontak",
        "⭐ Program Unggulan"
      ]);
    }

    function formatText(text) {
      return text
        .replace(/\[SHOW_PPDB_CARD\]/g, '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^- (.+)/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul style="margin:6px 0 6px 16px;padding:0;">$1</ul>')
        .replace(/\n/g, '<br>');
    }

    function addBotMsg(text, quickReplies) {
      const messagesEl = document.getElementById('rr-messages');
      const msgEl = document.createElement('div');
      msgEl.className = 'rr-msg bot';

      let html = `<div class="rr-msg-avatar"><svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.26 2 11.5c0 2.44 1.02 4.67 2.7 6.32L3 21l3.5-1.5C7.88 20.3 9.9 21 12 21c5.52 0 10-4.26 10-9.5S17.52 2 12 2z" fill="white"/></svg></div>`;
      html += `<div><div class="rr-msg-bubble">${formatText(text)}</div>`;

      if (text.includes('[SHOW_PPDB_CARD]')) {
        html += buildPPDBCard();
      }

      if (quickReplies && quickReplies.length) {
        html += `<div class="rr-quick-btns">` + quickReplies.map(q =>
          `<button class="rr-quick-btn" onclick="rrQuickReply('${escHtml(q)}')">${q}</button>`
        ).join('') + `</div>`;
      }
      html += `</div>`;
      msgEl.innerHTML = html;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function buildPPDBCard() {
      let html = `<div class="rr-ppdb-card"><div class="rr-ppdb-card-title">📝 Daftar Sekarang via WhatsApp</div>`;
      SCHOOL_CONTEXT.units.forEach(u => {
        html += `<a href="https://wa.me/${u.wa}?text=Assalamualaikum%2C%20saya%20ingin%20informasi%20PPDB%20${encodeURIComponent(u.name)}" target="_blank" class="rr-ppdb-unit">
        <img src="${u.logo}" class="rr-ppdb-unit-img" alt="${u.name}">
        <div><div class="rr-ppdb-unit-name">${u.name}</div><div class="rr-ppdb-unit-sub">${u.level}</div></div>
        <span class="rr-ppdb-wa-icon">💬</span>
      </a>`;
      });
      html += `</div>`;
      return html;
    }

    function addUserMsg(text) {
      const messagesEl = document.getElementById('rr-messages');
      const msgEl = document.createElement('div');
      msgEl.className = 'rr-msg user';
      msgEl.innerHTML = `<div class="rr-msg-bubble">${escHtml(text)}</div>`;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const messagesEl = document.getElementById('rr-messages');
      const el = document.createElement('div');
      el.className = 'rr-msg bot'; el.id = 'rr-typing';
      el.innerHTML = `<div class="rr-msg-avatar"><svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.26 2 11.5c0 2.44 1.02 4.67 2.7 6.32L3 21l3.5-1.5C7.88 20.3 9.9 21 12 21c5.52 0 10-4.26 10-9.5S17.52 2 12 2z" fill="white"/></svg></div><div class="rr-msg-bubble"><div class="rr-typing"><span></span><span></span><span></span></div></div>`;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('rr-typing');
      if (el) el.remove();
    }

    async function rrSendMsg() {
      const input = document.getElementById('rr-input');
      const text = input.value.trim();
      if (!text || isBusy) return;

      input.value = '';
      addUserMsg(text);
      chatHistory.push({ role: 'user', content: text });

      isBusy = true;
      input.disabled = true;
      addTyping();

      try {
        const res = await fetch('https://radenrahmatbalongbendo.sch.id/api/ollama_proxy.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: SYSTEM_PROMPT,
            messages: chatHistory
          })
        });

        const data = await res.json();
        removeTyping();

        if (data.error) throw new Error(data.error);
        const reply = data.reply || 'Maaf, saya gagal memproses pesan.';
        chatHistory.push({ role: 'assistant', content: reply });

        const hasPPDB = /ppdb|daftar|pendaftaran|masuk/i.test(reply + text);
        addBotMsg(reply, hasPPDB ? null : ["🏫 Info Madrasah", "📋 Syarat PPDB", "📞 Hubungi Kami"]);

      } catch (e) {
        console.error('[Chat Error]', e);
        removeTyping();
        chatHistory.pop();
        addBotMsg(`Mohon maaf, layanan sedang sibuk. Silakan hubungi kami di (031) 8970323 atau WhatsApp PPDB unit terkait.`, ["📞 WA MI", "📞 WA SMP", "📞 WA SMA"]);
      }

      isBusy = false;
      input.disabled = false;
      input.focus();
    }
    window.rrSendMsg = rrSendMsg;

    function rrQuickReply(text) {
      document.getElementById('rr-input').value = text;
      rrSendMsg();
    }
    window.rrQuickReply = rrQuickReply;
  })();
</script>
