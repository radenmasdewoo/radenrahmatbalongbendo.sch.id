server {
    listen 80;
    server_name mi.radenrahmatbalongbendo.sch.id;
    root /mnt/webdata/htdocs/mi;
    index index.html index.php;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/x-javascript;

    location / { try_files $uri $uri/ =404; }
    include /etc/nginx/snippets/static-cache-htdocs.conf;
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php7.2-fpm.sock;
    }
}
