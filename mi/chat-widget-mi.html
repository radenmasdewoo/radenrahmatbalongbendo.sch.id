
<style>

  #rr-chat-fab {

  }

  @keyframes fab-pulse {

  #rr-chat-fab.open svg.icon-chat {

  }

  #rr-chat-fab.open svg.icon-close {
    display: block !important;
  }

  #rr-chat-badge {
    position: absolute;
    top: -4px;
    right: -4px;

    color: #fff;

    align-items: center;

  @keyframes badge-bounce {

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18), 0 4px 16px rgba(0, 0, 0, 0.08);

    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(.34, 1.56, .64, 1), opacity 0.25s ease;

  #rr-chat-window.visible {

  .rr-chat-header {

  .rr-chat-header-status {

  .rr-chat-messages {

  .rr-msg {

  .rr-msg.user {

  .rr-msg-avatar {

  .rr-ppdb-card {

<script>
  (function () {
    const WA_NUMBER = "6285730017464";
    const SCHOOL_NAME = "MI RADEN RAHMAT";
    const SYSTEM_PROMPT = `Kamu adalah Asisten Virtual (AI) MI RADEN RAHMAT, Madrasah Ibtidaiyah (SD Islam) di Sidoarjo.
Awali jawaban dengan salam (Assalamu'alaikum). Gunakan bahasa yang sangat sopan, ramah, dan Islami.

LATAR BELAKANG MI RADEN RAHMAT:
- Berdiri: 01 Oktober 1949 (cikal bakal PERGURUAN RADEN RAHMAT).
- Sejarah Logo: Bintang 9 (NU), Bintang Besar (Rasulullah), 4 Kanan (Khulafaur Rasyidin), 4 Kiri (4 Mazhab).
- Mantan Nama: Pernah bernama SRINU (Sekolah Rakyat Islam NU) dan MWB (Madrasah Wajib Belajar).
- Fokus: Pendidikan karakter berbasis Aswaja An-Nahdliyah.
- Program Unggulan: Pembiasaan Sholat Dhuha berjamaah, Tahfidz Juz 30, Pembelajaran Adab (Kitab Alala).
- Kepala Madrasah: Nurul Lailiyatul Istiqomah, S.P., M.M.
- Akreditasi: Terakreditasi A (Status Unggul).

PPDB & KONTAK:
- WA PPDB MI: 6285730017464
- Di akhir jawaban tentang pendaftaran/biaya, selalu sertakan [SHOW_PPDB_CARD].
- Untuk informasi sangat detail, sarankan datang ke kantor jam 07.45 - 13.00 WIB.

Tugasmu:
- Jawab singkat (2-3 kalimat) dan solutif (fokus pada unit MI).
- Fokus pada info MI, namun tahu sejarah PERGURUAN RADEN RAHMAT (berdiri 1949).`;

    let messages = [];
    let isOpen = false;

    function escHtml(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function rrToggleChat() {
      isOpen = !isOpen;
      const win = document.getElementById('rr-chat-window');
      const fab = document.getElementById('rr-chat-fab');
      document.getElementById('rr-chat-badge').style.display = 'none';
      win.classList.toggle('visible', isOpen);
      fab.classList.toggle('open', isOpen);
      if (isOpen && messages.length === 0) rrShowGreeting();
      if (isOpen) setTimeout(() => document.getElementById('rr-input').focus(), 300);
    }
    window.rrToggleChat = rrToggleChat;

    function rrShowGreeting() {
      addBotMsg(`Assalamu'alaikum! 👋 Selamat datang di **MI RADEN RAHMAT**.\n\nSaya siap membantu menjawab pertanyaan seputar madrasah kami. Apa yang ingin Anda ketahui?`, [
        "📝 Cara Mendaftar (PPDB)",
        "📋 Syarat Masuk MI",
        "💰 Informasi Biaya",
        "📍 Lokasi Sekolah"
      ]);
    }

    function buildPPDBCard() {
      return `<div class="rr-ppdb-card">
      <div class="rr-ppdb-card-title">📝 Daftar Sekarang di MI RADEN RAHMAT</div>
      <a href="https://wa.me/${WA_NUMBER}?text=Assalamualaikum%2C%20saya%20ingin%20informasi%20PPDB%20MI%20RADEN%20RAHMAT" target="_blank" class="rr-ppdb-unit">
        <img src="https://radenrahmatbalongbendo.sch.id/logo-mi.webp" class="rr-ppdb-unit-img" alt="MI RADEN RAHMAT">
        <div><div class="rr-ppdb-unit-name">MI RADEN RAHMAT</div><div class="rr-ppdb-unit-sub">Madrasah Ibtidaiyah (Setara SD Islam)</div></div>
        <span class="rr-ppdb-wa-btn">💬 WA</span>
      </a>
    </div>`;
    }

    function addBotMsg(text, quickReplies) {
      const messagesEl = document.getElementById('rr-messages');
      const msgEl = document.createElement('div');
      msgEl.className = 'rr-msg bot';
      const cleanText = text.replace(/\[SHOW_PPDB_CARD\]/g, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      let html = `<div class="rr-msg-avatar"><svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.26 2 11.5c0 2.44 1.02 4.67 2.7 6.32L3 21l3.5-1.5C7.88 20.3 9.9 21 12 21c5.52 0 10-4.26 10-9.5S17.52 2 12 2z" fill="white"/></svg></div>`;
      html += `<div><div class="rr-msg-bubble">${cleanText}</div>`;
      if (text.includes('[SHOW_PPDB_CARD]')) html += buildPPDBCard();
      if (quickReplies?.length) {
        html += `<div class="rr-quick-btns">` + quickReplies.map(q => `<button class="rr-quick-btn" onclick="rrQuickReply('${escHtml(q)}')">${q}</button>`).join('') + `</div>`;
      }
      html += `</div>`;
      msgEl.innerHTML = html;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserMsg(text) {
      const messagesEl = document.getElementById('rr-messages');
      const msgEl = document.createElement('div');
      msgEl.className = 'rr-msg user';
      msgEl.innerHTML = `<div class="rr-msg-bubble">${escHtml(text)}</div>`;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const messagesEl = document.getElementById('rr-messages');
      const el = document.createElement('div');
      el.className = 'rr-msg bot'; el.id = 'rr-typing';
      el.innerHTML = `<div class="rr-msg-avatar"><svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.26 2 11.5c0 2.44 1.02 4.67 2.7 6.32L3 21l3.5-1.5C7.88 20.3 9.9 21 12 21c5.52 0 10-4.26 10-9.5S17.52 2 12 2z" fill="white"/></svg></div><div class="rr-msg-bubble"><div class="rr-typing"><span></span><span></span><span></span></div></div>`;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() { const el = document.getElementById('rr-typing'); if (el) el.remove(); }

    // ============================================================
    // KONFIGURASI MULTI-API FALLBACK
    // Urutan: Gemini Key1 → Gemini Key2 → Gemini Key3 → Groq LLaMA → Groq Llama70b → DeepSeek
    // ============================================================
    const GEMINI_MODEL = 'gemini-2.0-flash';
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;

    function makeGeminiCall(apiKey, label) {
      return {
        name: label,
        call: async (msgs) => {
          const contents = msgs.map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
          }));
          const res = await fetch(`${GEMINI_URL}?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents,
              generationConfig: { maxOutputTokens: 512, temperature: 0.7 }
            })
          });
          if (!res.ok) throw new Error(`${label} HTTP ${res.status}`);
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error(`${label}: empty response`);
          return text;
        }
      };
    }

    function makeGroqCall(apiKey, model, label) {
      return {
        name: label,
        call: async (msgs) => {
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model,
              messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...msgs],
              max_tokens: 512,
              temperature: 0.7
            })
          });
          if (!res.ok) throw new Error(`${label} HTTP ${res.status}`);
          const data = await res.json();
          const text = data?.choices?.[0]?.message?.content;
          if (!text) throw new Error(`${label}: empty response`);
          return text;
        }
      };
    }

    const API_PROVIDERS = [
      makeGeminiCall('AIzaSyCjfhEFnV9GavvFhwIqYf5zmdCBuq_UkCU', 'Gemini (Primary)'),
      makeGeminiCall('AIzaSyBQ-UMRsqvWol4Cy3q0Nu4R7D4ck4Nmsrs', 'Gemini (Backup 1)'),
      makeGeminiCall('AIzaSyCveEKFuXHMI3TIWg0GsEw4O8F5j-uQL8U', 'Gemini (Backup 2)'),
      makeGroqCall('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', 'llama-3.3-70b-versatile', 'Groq LLaMA 3.3 70B'),
      makeGroqCall('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', 'llama-3.3-70b-versatile', 'Groq LLaMA 3.3 70B (Backup)'),
      {
        name: 'DeepSeek R1',
        call: async (msgs) => {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer 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',
              'HTTP-Referer': 'https://radenrahmatbalongbendo.sch.id',
              'X-Title': 'MI Raden Rahmat Chatbot'
            },
            body: JSON.stringify({
              model: 'deepseek/deepseek-r1',
              messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...msgs],
              max_tokens: 512
            })
          });
          if (!res.ok) throw new Error('DeepSeek HTTP ' + res.status);
          const data = await res.json();
          const text = data?.choices?.[0]?.message?.content;
          if (!text) throw new Error('DeepSeek: empty response');
          return text;
        }
      }
    ];


    // Fungsi utama dengan fallback berantai
    async function callAIWithFallback(msgs) {
      for (const provider of API_PROVIDERS) {
        try {
          console.log(`[ChatBot] Mencoba: ${provider.name}`);
          const reply = await Promise.race([
            provider.call(msgs),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout 10s')), 10000))
          ]);
          console.log(`[ChatBot] Berhasil via: ${provider.name}`);
          return reply;
        } catch (err) {
          console.warn(`[ChatBot] ${provider.name} gagal:`, err.message);
        }
      }
      throw new Error('Semua provider gagal');
    }

    async function rrSendMsg() {
      const input = document.getElementById('rr-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addUserMsg(text);
      messages.push({ role: 'user', content: text });
      addTyping();
      try {
        const reply = await callAIWithFallback(messages.slice(-10));
        removeTyping();
        messages.push({ role: 'assistant', content: reply });
        addBotMsg(reply, ['📝 Info PPDB', '📋 Syarat Masuk', '📞 Hubungi Kami']);
      } catch (e) {
        removeTyping();
        addBotMsg('Maaf, semua layanan AI sedang tidak tersedia. Silakan hubungi langsung via WhatsApp. [SHOW_PPDB_CARD]');
      }
    }
    window.rrSendMsg = rrSendMsg;

    function rrQuickReply(text) { document.getElementById('rr-input').value = text; rrSendMsg(); }
    window.rrQuickReply = rrQuickReply;
  })();
</script>
